version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/apps/grabpt
    overwrite: yes

permissions:
  - object: /home/ubuntu/apps/grabpt
    pattern: "**"
    owner: ubuntu
    group: ubuntu

hooks:
  AfterInstall:
    - location: scripts/stop.sh
      timeout: 120
      runas: ubuntu
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300
      runas: ubuntu
