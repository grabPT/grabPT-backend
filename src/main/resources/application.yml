server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: none

#  servlet:
#    session:
#      cookie:
#        domain: grabpt.com         # 상위 도메인으로 공유
#        same-site: none            # 서브도메인 간 전송을 위해 None
#        secure: true               # HTTPS 필수
#        http-only: true            # JS 접근 차단
#        name: OAUTHLOGINSESSION

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  show-actuator: false
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

spring:
  config:
    import: optional:file:.env.properties

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 80MB

  datasource:
    url: jdbc:mysql://grabptdb.cl4e0asq8fu0.ap-northeast-2.rds.amazonaws.com:3306/grabpt?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${GRABPTDB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Seoul

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: true
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 1000
        jdbc:
          time-zone: Asia/Seoul
  sql:
    init:
      mode: never

  security:
    oauth2:
      client:
        registration:
          google: # /oauth2/authorization/google 이 주소를 동작하게 한다.
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id

jwt:
  token:
    secret-key: ${JWT_SECRET_KEY}
    expiration:
      access: 14400000

coolsms:
  apiKey: ${COOLSMS_API_KEY}
  apiSecret: ${COOLSMS_API_SECRET}
  fromNumber: ${FROM_NUMBER}

cloud:
  aws:
    s3:
      bucket: grabpt-image-bucket-2
      path:
        proPhoto: proPhoto
        userPhoto: userPhoto
        profilePhoto: profilePhoto
        suggestionPhoto: suggestionPhoto
        contractPhoto: contractPhoto
        test: test
    region:
      static: ap-northeast-2
    stack:
      auto: false
    credentials:
      accessKey: ${AWS_ACCESS_KEY_ID}
      secretKey: ${AWS_SECRET_ACCESS_KEY}


import:
  api:
    key: ${IMP_API_KEY}
    secret: ${IMP_API_SECRET}

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG
    com.grabpt.config.oauth: DEBUG
    org.springframework.security.oauth2.client.web: DEBUG
    org.springframework.security.oauth2.client: DEBUG
    com.grabpt: DEBUG
    org.springframework.security: INFO
    org.springframework.security.oauth2: DEBUG


