name: Deploy to EC2 via CodeDeploy + Docker

on:
  push:
    branches: [ develop ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPO: grabpt-server

permissions:
  contents: read

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) ECR 로그인
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 2) Docker build & push (tags: SHA, latest)
      - name: Build Docker image
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker tag $IMAGE ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
      - name: Push Docker image
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest

      # 3) 배포 아티팩트 구성(.env 포함)
      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy/scripts
          cp docker-compose.yml appspec.yml deploy/
          cp -r scripts/*.sh deploy/scripts/

          cat > deploy/.env <<EOF
          AWS_REGION=${{ env.AWS_REGION }}
          ECR_REGISTRY=${{ env.ECR_REGISTRY }}
          ECR_REPO=${{ env.ECR_REPO }}
          IMAGE_TAG=${{ github.sha }}

          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          EOF

      - name: Upload artifact for transfer
        uses: actions/upload-artifact@v4
        with:
          name: codedeploy-bundle
          path: deploy/

  codedeploy_push:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: codedeploy-bundle
          path: bundle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push bundle to S3 via CodeDeploy
        run: |
          APP_NAME=${{ secrets.CODEDEPLOY_APP_NAME }}
          GROUP_NAME=${{ secrets.CODEDEPLOY_GROUP_NAME }}
          BKT=${{ secrets.CODEDEPLOY_S3_BUCKET }}
          KEY=${{ github.sha }}.zip

          aws deploy push \
            --application-name "$APP_NAME" \
            --s3-location s3://$BKT/$KEY \
            --source ./bundle

          aws deploy create-deployment \
            --application-name "$APP_NAME" \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name "$GROUP_NAME" \
            --s3-location bucket=$BKT,key=$KEY,bundleType=zip
            --file-exists-behavior OVERWRITE 
