<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-lg shadow-lg max-w-sm w-full text-center">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">로그인</h1>
    <p class="text-gray-500 mb-8">소셜 계정으로 간편하게 로그인하세요.</p>

    <div class="space-y-4">
        <a href="http://localhost:8080/oauth2/authorization/google?redirect_uri=http://localhost:8080"
           class="inline-flex items-center justify-center w-full px-4 py-3 border border-gray-300 rounded-full shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
            <i class="fab fa-google text-red-500 text-lg mr-2"></i>
            <span class="text-base font-semibold">Google 계정으로 로그인(8080)</span>
        </a>

        <a href="http://localhost:8080/oauth2/authorization/google?redirect_uri=http://localhost:5173"
           class="inline-flex items-center justify-center w-full px-4 py-3 border border-gray-300 rounded-full shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
            <i class="fab fa-google text-red-500 text-lg mr-2"></i>
            <span class="text-base font-semibold">Google 계정으로 로그인(5173)</span>
        </a>

        <a href="http://localhost:8080/oauth2/authorization/kakao"
           class="inline-flex items-center justify-center w-full px-4 py-3 border border-gray-300 rounded-full shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
            <i class="fas fa-comment text-yellow-500 text-lg mr-2"></i>
            <span class="text-base font-semibold">Kakao 계정으로 로그인</span>
        </a>

        <a href="http://localhost:8080/oauth2/authorization/naver"
           class="inline-flex items-center justify-center w-full px-4 py-3 border border-gray-300 rounded-full shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
            <i class="fas fa-envelope text-green-500 text-lg mr-2"></i>
            <span class="text-base font-semibold">Naver 계정으로 로그인</span>
        </a>
    </div>

</div>

</body>
</html>
