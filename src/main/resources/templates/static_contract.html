<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <style>
        /* PDF에 적용될 CSS 테스트 */
        body {
            font-family: 'NanumGothic'; /* 서비스 코드에서 등록한 폰트 이름 */
        }
        h1 {
            color: blue;
            text-align: center;
        }
        p {

</head>
<body>

<p>한글 폰트가 잘 보이는지 확인합니다.</p>
</body>
</html>
