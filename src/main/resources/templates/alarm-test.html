<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>알림 기능 전체 예시</title>
    <style>
        /* 알림 버튼 스타일 */
        #alarm-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 48px;
            height: 48px;
            border-radius: 24px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 24px;
            z-index: 10000;
            position: fixed;
        }
        /* 빨간 점 배지 */
        #alarm-badge {
            display: none;
            position: absolute;
            top: 6px;
            right: 6px;
            width: 12px;
            height: 12px;
            background: red;
            border-radius: 50%;
        }
        /* 알림 목록 컨테이너 */
        #alarm-list-container {
            display: none;
            position: fixed;
            top: 60px;
            right: 10px;
            width: 320px;
            max-height: 400px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 9999;
        }
        /* 개별 알림 아이템 스타일 */
        .alarm-item {
            border-bottom: 1px solid #eee;
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .alarm-title {
            font-weight: bold;
        }
        .alarm-content {
            font-size: 13px;
            color: #333;
        }
        .alarm-date {
            font-size: 11px;
            color: #888;
            margin-left: 10px;
        }
        .unread-dot {
            width: 10px;
            height: 10px;
            background-color: red;
            border-radius: 50%;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<!-- 알림 버튼 -->
<button id="alarm-btn" aria-label="알림">
    🔔
    <span id="alarm-badge"></span>
</button>

<!-- 알림 목록 -->
<div id="alarm-list-container"></div>

<!-- SockJS, Stomp.js CDN (웹소켓 사용) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
    // 변수 선언
    let stompClient = null;
    let userId = null;

    const alarmBtn = document.getElementById('alarm-btn');
    const alarmBadge = document.getElementById('alarm-badge');
    const alarmListContainer = document.getElementById('alarm-list-container');

    // 사용자 정보 호출 (userId 획득)
    async function fetchUserId() {
        const response = await fetch('/api/users/info', { credentials: 'include' });
        if (!response.ok) throw new Error('사용자 정보 조회 실패');
        const data = await response.json();
        return data.result.userId;
    }

    // WebSocket 연결 및 Stomp 구독
    function connectWebSocket() {
        return new Promise((resolve, reject) => {
            if (stompClient && stompClient.connected) {
                resolve();
                return;
            }
            const socket = new SockJS("/ws-connect");
            stompClient = Stomp.over(socket);
            stompClient.connect({}, () => resolve(), err => reject(err));
        });
    }

    // 빨간 점 배지 표시 토글
    function showBadge(show) {
        alarmBadge.style.display = show ? 'inline-block' : 'none';
    }

    // 서버에서 알림 목록 가져오기
    async function fetchAlarmList() {
        try {
            const res = await fetch('/api/alarmList', { credentials: 'include' });
            if (!res.ok) throw new Error('알림 목록 조회 실패');
            const data = await res.json();
            return data.result; // result 배열 반환
        } catch (err) {
            console.error('알림 목록 조회 실패:', err);
            return [];
        }
    }

    // 알림 목록을 화면에 렌더링
    function renderAlarmList(alarms) {
        alarmListContainer.innerHTML = '';

        if (!alarms.length) {
            alarmListContainer.innerHTML = '<p style="padding: 10px; color:#666;">알림이 없습니다.</p>';
            return;
        }

        alarms.forEach(alarm => {
            const item = document.createElement('div');
            item.className = 'alarm-item';
            item.style.cursor = alarm.redirectUrl ? 'pointer' : 'default';

            // 텍스트 영역 (제목 + 내용)
            const textDiv = document.createElement('div');
            textDiv.style.flex = '1';

            const title = document.createElement('div');
            title.className = 'alarm-title';
            title.textContent = alarm.title;

            const content = document.createElement('div');
            content.className = 'alarm-content';
            content.textContent = alarm.content;

            textDiv.appendChild(title);
            textDiv.appendChild(content);

            // 우측 날짜 및 미확인 빨간 점
            const rightDiv = document.createElement('div');
            rightDiv.style.display = 'flex';
            rightDiv.style.alignItems = 'center';

            const date = document.createElement('div');
            date.className = 'alarm-date';
            date.textContent = new Date(alarm.createdAt).toLocaleString();

            const unreadDot = document.createElement('span');
            unreadDot.className = 'unread-dot';
            unreadDot.style.display = (alarm.read === false) ? 'inline-block' : 'none';

            rightDiv.appendChild(date);
            rightDiv.appendChild(unreadDot);

            // 클릭 시 읽음 처리 & redirectUrl 이동
            if (alarm.redirectUrl) {
                item.addEventListener('click', async () => {
                    try {
                        const res = await fetch(`/api/alarm/${alarm.id}/read`, {
                            method: 'PATCH',
                            credentials: 'include',
                            headers: { 'Content-Type': 'application/json' }
                        });
                        if (res.ok) {
                            unreadDot.style.display = 'none'; // 빨간 점 숨기기
                        } else {
                            console.warn('읽음 처리 실패:', res.status);
                        }
                    } catch (error) {
                        console.error('읽음 처리 중 오류:', error);
                    }
                    window.location.href = alarm.redirectUrl;
                });
            }

            item.appendChild(textDiv);
            item.appendChild(rightDiv);
            alarmListContainer.appendChild(item);
        });
    }

    // 알림 버튼 클릭 이벤트
    alarmBtn.addEventListener('click', async () => {
        // 빨간 점 숨기기 및 버튼 숨김
        showBadge(false);
        alarmBtn.style.display = 'none';

        // 알림 목록 불러오기 및 화면 표시
        const alarms = await fetchAlarmList();
        renderAlarmList(alarms);
        alarmListContainer.style.display = 'block';
    });

    // WebSocket 알림 수신 구독 설정
    async function subscribeToAlarm() {
        try {
            userId = await fetchUserId();
            if (!userId) throw new Error('userId가 없음');

            await connectWebSocket();
            const subscriptionDest = `/subscribe/alarm/${userId}`;
            stompClient.subscribe(subscriptionDest, message => {
                try {
                    const alarmData = JSON.parse(message.body);
                    console.log('알림 수신:', alarmData);
                    showBadge(true); // 알림 버튼에 빨간 점 표시
                    // 원한다면 실시간 알림 목록 자동 갱신 로직 추가 가능
                } catch (e) {
                    console.error('알림 메시지 파싱 실패', e);
                }
            });
        } catch (e) {
            console.error('알림 구독 실패:', e);
        }
    }

    // 초기화
    window.addEventListener('DOMContentLoaded', () => {
        alarmBtn.style.display = 'block';
        showBadge(false);
        alarmListContainer.style.display = 'none';

        subscribeToAlarm();
    });

</script>

</body>
</html>
