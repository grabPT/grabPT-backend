<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GrabPT 실시간 채팅</title>
    <!-- SockJS & StompJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
            background: #f4f7fb;
            padding: 30px;
            margin: 0;
        }
        h2 {
            margin-top: 0;
            font-weight: bold;
            letter-spacing: -1px;
        }

        /* 채팅방 리스트 */
        #chat-room-list {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 3px 16px 0 rgba(148,152,162,0.08);
            padding: 0;
            margin-top: 10px;
            max-width: 420px;
            min-width: 300px;
            margin-bottom: 12px;
        }
        #chat-room-list > h3 {
            padding: 18px 23px 2px 23px;
            margin: 0;
            font-size: 1.04em;
            color: #7B8596;
            letter-spacing: 0;
        }
        .chat-room-item {
            display: flex;
            align-items: center;
            padding: 12px 19px 12px 19px;
            border-bottom: 1px solid #f1f2f4;
            background: transparent;
            cursor: pointer;
            transition: background 0.15s;
        }
        .chat-room-item:hover {
            background: #f7faff;
        }
        .chat-profile {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            margin-right: 13px;
            background: #f0f2f5;
            object-fit: cover;
        }
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-room-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
            color: #23272f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-last-message {
            font-size: 13px;
            color: #868C98;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-left: 12px;
            min-width: 40px;
        }
        .chat-time {
            font-size: 11px;
            color: #bbc3cf;
            margin-bottom: 5px;
        }
        .unread-badge {
            background: #ff365d;
            color: #fff;
            border-radius: 13px;
            padding: 0 8px;
            min-width: 17px;
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            display: inline-block;
            line-height: 18px;
        }

        /* 채팅방 내부 */
        #chat-room {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1.5px 10px 0 rgba(171,178,207,0.10);
            max-width: 520px;
            margin-top: 20px;
            padding: 18px 18px 13px 18px;
        }
        #chat-title {
            margin: 0 0 8px 0;
            font-size: 18px;
        }
        #chat-log {
            background: #f5f8fc;
            border: none;
            border-radius: 8px;
            padding: 16px 10px;
            height: 340px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .mine {
            display: flex;
            flex-direction: row-reverse;
            margin-bottom: 7px;
        }
        .mine .bubble {
            background: #296cfb;
            color: #fff;
            border-radius: 21px 21px 3px 21px;
            padding: 8px 14px 8px 15px;
            font-size: 15px;
            max-width: 70%;
            word-break: break-all;
        }
        .other {
            display: flex;
            margin-bottom: 7px;
        }
        .other .bubble {
            background: #f2f5fa;
            color: #222;
            border-radius: 21px 21px 21px 2.5px;
            padding: 8px 14px 8px 15px;
            font-size: 15px;
            max-width: 70%;
            word-break: break-all;
        }
        .msg-time {
            font-size: 11px;
            color: #adb7be;
            margin-top: 5px;
            margin-left: 5px;
            margin-right: 5px;
            align-self: flex-end;
        }

        /* 메시지 입력창, 버튼 */
        #msg-input {
            width: 74%;
            font-size: 16px;
            border: 1px solid #e3e7ef;
            border-radius: 7px;
            padding: 8px 14px;
            margin-right: 6px;
            outline: none;
            background: #fafcff;
            transition: border 0.16s;
            box-sizing: border-box;
        }
        #msg-input:focus {
            border: 1.5px solid #5890ff;
        }
        #send-btn {
            background: #2e6bff;
            color: #fff;
            border: none;
            border-radius: 7px;
            padding: 9px 19px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.15s;
            outline: none;
        }
        #send-btn:active {
            background: #1742aa;
        }

        @media (max-width: 600px) {
            #chat-room-list, #chat-room {
                max-width: 98vw;
                min-width: 0;
            }
        }
    </style>
</head>
<body>

<h2>🙋 채팅방 리스트</h2>

<div id="chat-room-list"></div>

<hr style="margin:25px 0 20px 0; border:0;border-top:1px solid #eee;max-width:530px;">

<button id="unread-count-btn" style="position:relative; margin:10px;">
    📩 안 읽은 메시지
    <span id="unread-total-badge"
          style="position:absolute; top:-5px; right:-10px; background:#d33; color:white;
                 padding:2px 6px; border-radius:10px; font-size:12px; display:none;">
        0
    </span>
</button>

<div id="chat-room" style="display:none;">
    <h2 id="chat-title"></h2>
    <div id="chat-log" style="height:300px; overflow-y:auto; border:1px solid #ccc;"></div>
    <input id="msg-input" type="text" placeholder="메시지 입력">
    <button onclick="sendMsg()">전송</button>
</div>

<script>
    let currentCursor = 0;
    let currentRoomId = null;
    let senderId = null; // 로그인 사용자 ID
    let userId = null;
    let stompClient = null;
    let subscriptions = {
        room: null,
        readStatus: null,
        unreadCount: null
    };
    const displayedMessageIds = new Set(); // 중복 메시지 방지

    // 로그인 사용자 정보 조회
    async function fetchUserId() {
        const response = await fetch('/api/users/info', { credentials: 'include' });
        if (!response.ok) throw new Error('사용자 정보 조회 실패');
        const data = await response.json();
        return data.result.userId;
    }

    // 전체 안읽은 메시지 개수 API 호출
    async function fetchUnreadCount() {
        try {
            const res = await fetch('/chat/unreadCount', { credentials: 'include' });
            if (!res.ok) throw new Error('Unread count API error');
            const data = await res.json();
            if (data.isSuccess) return data.result;
            else {
                console.warn('Unread count API responded with failure');
                return 0;
            }
        } catch (err) {
            console.error('Unread count fetch failed:', err);
            return 0;
        }
    }

    function unsubscribe(type) {
        if (subscriptions[type]) {
            subscriptions[type].unsubscribe();
            subscriptions[type] = null;
        }
    }

    // 웹소켓 연결
    function connectWebSocket() {
        return new Promise((resolve, reject) => {
            if (stompClient && stompClient.connected) {
                resolve();
                return;
            }
            const socket = new SockJS("/ws-connect");
            stompClient = Stomp.over(socket);
            stompClient.connect({}, () => resolve(), err => reject(err));
        });
    }

    // 전체 안읽은 메시지 수 구독
    function subscribeUnreadCount(userId) {
        unsubscribe("unreadCount");
        subscriptions.unreadCount = stompClient.subscribe(
            `/subscribe/chat/${userId}/unread-count`,
            msg => {
                const count = JSON.parse(msg.body);
                updateUnreadTotalUI(count);
            }
        );
    }

    // 전체 안읽은 메시지 UI 업데이트
    function updateUnreadTotalUI(count) {
        const badge = document.getElementById("unread-total-badge");
        if (count > 0) {
            badge.style.display = "inline-block";
            badge.textContent = count;
        } else {
            badge.style.display = "none";
        }
    }

    // 방 읽음 상태 구독
    function subscribeReadStatus(roomId) {
        unsubscribe("readStatus");
        subscriptions.readStatus = stompClient.subscribe(`/subscribe/chat/${roomId}/read-status`, (msg) => {
            const body = JSON.parse(msg.body);
            updateMessageReadCountUI(body.messageId, body.readCount);
        });
    }

    // 메시지 읽음 UI 변경
    function updateMessageReadCountUI(messageId, newReadCount){
        const messageEl = document.querySelector(`[data-message-id="${messageId}"]`);
        if(!messageEl) return;

        const readCountEl = messageEl.querySelector(".msg-read-count");
        if(readCountEl){
            if(newReadCount === 0){
                readCountEl.textContent = "✔ 모두 읽음";
                readCountEl.style.color = "#4CAF50";
            } else {
                readCountEl.textContent = `👁️ ${newReadCount}명 미확인`;
                readCountEl.style.color = "#d33";
            }
        }
    }

    // 채팅방 구독(실시간 메시지)
    function subscribeChatRoom(roomId) {
        unsubscribe("room");
        subscriptions.room = stompClient.subscribe(`/subscribe/chat/${roomId}`, (msg) => {
            const body = JSON.parse(msg.body);
            appendMessage(body);

        });
    }

    // 현재 방의 전체 읽음 처리 (입장 시)
    async function markLastReadWhen1(roomId) {
        try {
            await fetch(`/chatRoom/${roomId}/readWhenEnter`, { method: "POST" });
        } catch (e) {
            console.error("읽음 상태 일괄 갱신 실패:", e);
        }
    }

    // 현재 방의 단건 읽음 처리 (메시지 수신 후)
    async function markLastReadWhen2(roomId) {
        try {
            await fetch(`/chatRoom/${roomId}/readWhenExist`, { method: "POST" });
        } catch (e) {
            console.error("읽음 상태 단건 갱신 실패:", e);
        }
    }

    // 채팅방 입장
    async function enterRoom(roomId) {
        if (currentRoomId === roomId) return;

        if (currentRoomId !== null) {
            await markLastReadWhen1(currentRoomId);
            if (subscriptions.room) {
                subscriptions.room.unsubscribe();
                subscriptions.room = null;
            }
            if (subscriptions.readStatus) {
                subscriptions.readStatus.unsubscribe();
                subscriptions.readStatus = null;
            }
        }

        currentRoomId = roomId;

        document.getElementById("chat-title").textContent = `채팅방 #${roomId}`;
        document.getElementById("chat-log").innerHTML = "";
        document.getElementById("chat-room").style.display = "block";

        await markLastReadWhen1(roomId);

        const res = await fetch(`/chatRoom/${roomId}/messages?cursor=0`);
        const result = await res.json();

        if (result.isSuccess) {
            const responseData = result.result;
            const messages = responseData.messages;
            currentCursor = responseData.cursor;

            messages.sort((a, b) => new Date(a.sendAt) - new Date(b.sendAt));
            messages.forEach(msg => appendMessage(msg));
        } else {
            alert("메시지를 불러오지 못했습니다.");
            return;
        }

        if (!stompClient || !stompClient.connected) {
            await connectWebSocket();
        }

        await subscribeChatRoom(roomId);
        await subscribeReadStatus(roomId);
    }

    // 메시지 전송
    function sendMsg() {
        const input = document.getElementById("msg-input");
        const content = input.value.trim();
        if (!content || !currentRoomId || !stompClient || !stompClient.connected) {
            return;
        }

        const message = {
            roomId: currentRoomId,
            senderId: senderId,
            content: content,
            messageType: "TEXT"
        };

        stompClient.send(`/publish/chat/${currentRoomId}`, {}, JSON.stringify(message));
        input.value = '';
    }

    // 메시지 중복 방지 후 추가
    function appendMessage(message) {
        if (message.messageId && displayedMessageIds.has(message.messageId)) {
            return; // 이미 추가된 메시지 중복 방지
        }
        if (message.messageId) displayedMessageIds.add(message.messageId);

        const log = document.getElementById("chat-log");
        if (!log) return;

        const div = document.createElement("div");

        if (message.messageId !== undefined) {
            div.setAttribute("data-message-id", message.messageId);
        }

        const isMine = message.senderId === senderId;
        const time = message.sendAt ? formatMsgTime(message.sendAt) : "";

        div.className = isMine ? "mine" : "other";

        const bubble = document.createElement("span");
        bubble.className = "bubble";

        switch (message.messageType) {
            case "IMAGE":
                bubble.innerHTML = message.content ?
                    `<img src="${message.content}" style="max-width:170px;max-height:128px;border-radius:7px;">`
                    : "(이미지 없음)";
                break;
            case "FILE":
                bubble.innerHTML = message.content ?
                    `파일을 보냈습니다. <a href="${message.content}" target="_blank" download>다운로드</a>`
                    : "(파일 없음)";
                break;
            default:
                bubble.textContent = message.content || "";
        }

        const timeEl = document.createElement("span");
        timeEl.className = "msg-time";
        timeEl.textContent = time;

        const readCountEl = document.createElement("span");
        readCountEl.className = "msg-read-count";
        readCountEl.style.marginLeft = "8px";
        readCountEl.style.fontSize = "11px";

        if (isMine) {
            if (message.readCount !== null && message.readCount !== undefined) {
                if (message.readCount === 0) {
                    readCountEl.textContent = "✔ 모두 읽음";
                    readCountEl.style.color = "#4CAF50";
                } else {
                    readCountEl.textContent = `👁️ ${message.readCount}명 미확인`;
                    readCountEl.style.color = "#d33";
                }
            }
        } else {
            readCountEl.textContent = "";
        }

        if (isMine) {
            div.appendChild(timeEl);
            div.appendChild(readCountEl);
            div.appendChild(bubble);
        } else {
            div.appendChild(bubble);
            div.appendChild(timeEl);
        }
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    function formatMsgTime(sendAt) {
        const dt = new Date(sendAt);
        const now = new Date();
        if(dt.toDateString() === now.toDateString()){
            let h = dt.getHours();
            let m = dt.getMinutes();
            let ap = h < 12 ? "오전" : "오후";
            h = h % 12;
            if(h === 0) h = 12;
            return `${ap} ${h}:${m < 10 ? "0"+m : m}`;
        } else {
            return `${dt.getMonth()+1}/${dt.getDate()}`;
        }
    }

    // 이전 메시지 추가 로드(스크롤 업 등)
    async function loadMoreMessages() {
        if (!currentRoomId) return;

        const res = await fetch(`/chatRoom/${currentRoomId}/messages?cursor=${currentCursor}`);
        let result;
        try { result = await res.json(); }
        catch(e) { alert("서버 응답 이상"); return; }

        if (result.isSuccess) {
            const responseData = result.result;
            const messages = responseData.messages;
            const newCursor = responseData.cursor;

            if (messages.length === 0) return;

            messages.forEach(msg => appendMessage(msg));
            currentCursor = newCursor;
        }
    }

    // 파일 업로드 후 전송
    async function uploadAndSendFile(input) {
        const file = input.files[0];
        if (!file || !currentRoomId) return;

        // 웹소켓 연결 여부 확인 후 없으면 재연결
        if (!stompClient || !stompClient.connected) {
            await connectWebSocket();
            if (!stompClient.connected) {
                alert("서버와 연결되지 않았습니다.");
                return;
            }
        }

        const formData = new FormData();
        formData.append("file", file);

        const res = await fetch(`/chatRoom/${currentRoomId}/upload`, {
            method: "POST",
            body: formData
        });

        let result;
        try { result = await res.json(); }
        catch (e) { alert("파일 업로드 응답 문제"); input.value = ""; return; }

        if(result.isSuccess){
            const dto = result.result;
            stompClient.send(`/publish/chat/${currentRoomId}`, {}, JSON.stringify(dto));
        } else {
            alert("파일 업로드 실패");
        }
        input.value = "";
    }

    // ------------------------------------------------------------------
    // 채팅방 목록 영역 로드 (버튼 클릭 시 동작)
    // ------------------------------------------------------------------

    async function loadChatRooms() {
        const list = document.getElementById("chat-room-list");
        if (!list) return;

        try {
            const res = await fetch(`/chatRoom/list`);
            if (!res.ok) {
                alert("채팅방 목록을 불러오지 못했습니다.");
                return;
            }
            const result = await res.json();

            if (!result.isSuccess) {
                alert("채팅방 목록을 불러오지 못했습니다.");
                return;
            }

            const rooms = result.result;

            if (rooms.length === 0) {
                list.innerHTML = '<h3>내 채팅방</h3>';
                list.innerHTML += "<p style='padding:20px 24px;color:#889;'>채팅방이 없습니다.</p>";
                return;
            }

            senderId = userId; // 안전하게 로그인 사용자 ID 할당
            list.innerHTML = '<h3>내 채팅방</h3>';

            rooms.forEach(room => {
                const item = document.createElement("div");
                item.className = "chat-room-item";
                item.onclick = () => enterRoom(room.chatRoomId);

                const img = document.createElement("img");
                img.className = "chat-profile";
                img.src = room.otherUserProfile || "https://via.placeholder.com/38?text=U";

                const info = document.createElement("div");
                info.className = "chat-info";
                info.innerHTML = `
                <div class="chat-room-title">${room.roomName}</div>
                <div class="chat-last-message">${room.lastMessage ? room.lastMessage : "(대화 없음)"}</div>
            `;

                const meta = document.createElement("div");
                meta.className = "chat-meta";

                let lastTime = "";
                if (room.lastMessageTime) {
                    const dt = new Date(room.lastMessageTime);
                    const now = new Date();
                    if(dt.toDateString() === now.toDateString())
                        lastTime = dt.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
                    else
                        lastTime = (dt.getMonth()+1)+"/"+dt.getDate();
                }
                meta.innerHTML = `
                <span class="chat-time">${lastTime}</span>
                ${room.unreadCount && room.unreadCount > 0 ? `<span class="unread-badge">${room.unreadCount}</span>` : ""}
            `;

                item.appendChild(img);
                item.appendChild(info);
                item.appendChild(meta);

                list.appendChild(item);
            });

            list.style.display = "block"; // 목록 영역 보이기
        } catch (err) {
            console.error("채팅방 목록 로드 실패", err);
            alert("채팅방 목록을 불러오는 중 오류가 발생했습니다.");
        }
    }

    // ------------------------------------------------------------------
    // 초기화 및 이벤트 핸들러 등록
    // ------------------------------------------------------------------

    window.addEventListener("DOMContentLoaded", async () => {
        try {
            // 1) 로그인 사용자 ID 먼저 가져오기
            userId = await fetchUserId();
            senderId = userId; // 안전하게 할당

            // 2) 웹소켓 연결
            await connectWebSocket();

            // 3) 웹소켓 구독 전에 안읽은 메시지 수 API 호출 후 UI 업데이트
            const initialUnreadCount = await fetchUnreadCount();
            updateUnreadTotalUI(initialUnreadCount);

            // 4) 전체 안읽은 개수 실시간 구독 시작
            subscribeUnreadCount(userId);

            // 5) 채팅방 목록은 아직 로드하지 않음 (버튼 클릭 시 로드)

        } catch (err) {
            console.error("초기화 실패:", err);
        }
    });

    // 전체 안읽은 메시지 버튼 클릭 시 채팅방 목록 로드
    window.addEventListener("DOMContentLoaded", () => {
        const unreadBtn = document.getElementById("unread-count-btn");
        if (unreadBtn) {
            unreadBtn.addEventListener("click", async () => {
                const chatRoomList = document.getElementById("chat-room-list");
                if (!chatRoomList) return;

                // 목록이 숨겨져 있거나 빈 경우에만 로드
                if (chatRoomList.style.display === "none" || chatRoomList.innerHTML.trim() === "") {
                    await loadChatRooms();
                    chatRoomList.scrollIntoView({ behavior: "smooth" });
                } else {
                    // 보이고 있다면 토글 숨김/보임 가능 (옵션)
                    if(chatRoomList.style.display === "none"){
                        chatRoomList.style.display = "block";
                        chatRoomList.scrollIntoView({ behavior: "smooth" });
                    } else {
                        chatRoomList.style.display = "none";
                    }
                }
            });
        }
    });

</script>
</body>
</html>
