<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>실시간 알림 수신 예제</title>
    <style>
        #alarm-container {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 320px;
            max-height: 400px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 9999;
        }
        .alarm-item {
            border-bottom: 1px solid #eee;
            padding: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .alarm-item:hover {
            background-color: #f0f8ff;
        }
        .alarm-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .alarm-time {
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div id="alarm-container" aria-live="polite" aria-atomic="true"></div>

<!-- SockJS, Stomp.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
    let stompClient = null;

    // 사용자 정보 API (/api/users/info) 호출해서 userId 받아오기
    async function fetchUserId() {
        const response = await fetch('/api/users/info', {
            credentials: 'include' // 쿠키 기반 인증 시 include 필요
        });
        if (!response.ok) throw new Error('사용자 정보 조회 실패');
        const data = await response.json();
        return data.result.userId;
    }

    // WebSocket 연결 (SockJS + Stomp)
    function connectWebSocket() {
        return new Promise((resolve, reject) => {
            if (stompClient && stompClient.connected) {
                resolve();
                return;
            }
            const socket = new SockJS("/ws-connect");
            stompClient = Stomp.over(socket);
            stompClient.connect({}, () => resolve(), err => reject(err));
        });
    }

    // 화면에 알림 표시
    function displayAlarm(alarmData) {
        const container = document.getElementById('alarm-container');
        const item = document.createElement('div');
        item.className = 'alarm-item';

        item.innerHTML = `
      <div class="alarm-title">${alarmData.title}</div>
      <div>${alarmData.content}</div>
      <div class="alarm-time">${new Date(alarmData.createdAt).toLocaleString()}</div>
    `;

        if (alarmData.redirectUrl) {
            item.addEventListener('click', () => {
                window.location.href = alarmData.redirectUrl;
            });
        }

        container.prepend(item);  // 최신 알림이 상단
    }

    // userId 받아와서 WebSocket 구독 처리
    async function subscribeToAlarm() {
        try {
            const userId = await fetchUserId();
            if (!userId) throw new Error('userId가 존재하지 않음');

            await connectWebSocket();

            const subscriptionDest = `/subscribe/alarm/${userId}`;
            stompClient.subscribe(subscriptionDest, message => {
                try {
                    const alarmData = JSON.parse(message.body);
                    console.log('알림 수신:', alarmData);
                    displayAlarm(alarmData);
                } catch (e) {
                    console.error('알림 메시지 파싱 실패', e);
                }
            });

        } catch (error) {
            console.error('알림 구독 실패:', error);
            alert('알림 기능을 시작하는데 실패했습니다.');
        }
    }

    window.addEventListener('DOMContentLoaded', subscribeToAlarm);
</script>

</body>
</html>
